[package]
name = "tapconductor-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Real-time-safe audio engine for TapConductor"

[features]
default = []
cpal-backend = ["dep:cpal"]
wasapi-probe = ["dep:windows"]
wasapi-cpal-fallback = ["wasapi-probe", "cpal-backend"]
asio-backend = ["cpal-backend", "cpal/asio"]

[dependencies]
cpal = { version = "0.15.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Devices_Properties",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
