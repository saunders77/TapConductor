[package]
name = "tauri-plugin-apple-audio-session"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "TapConductor iPad AVAudioSession integration"
links = "tauri-plugin-apple-audio-session"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

[dependencies]
serde.workspace = true
tauri = { version = "2.10" }
