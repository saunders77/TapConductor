[workspace]
resolver = "2"
members = [
  "crates/tapconductor-score",
  "crates/tapconductor-performance",
  "crates/tapconductor-audio",
  "crates/tapconductor-midi",
  "tools/latency-probe",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["TapConductor contributors"]
repository = "https://github.com/micha/CLITapConductor"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
