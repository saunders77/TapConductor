[package]
name = "tapconductor-midi"
version = "1.2.0"
edition = "2021"
license-file.workspace = true
description = "Platform-neutral MIDI input and output for TapConductor"

[features]
default = []
midir-backend = ["dep:midir"]

[dependencies]
midir = { version = "0.10.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
coremidi = "0.9.1"
