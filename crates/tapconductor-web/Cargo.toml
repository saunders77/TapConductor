[package]
name = "tapconductor-web"
version = "0.1.0"
edition = "2021"
license-file.workspace = true
description = "WebAssembly score-import bridge for TapConductor"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
tapconductor-score = { path = "../tapconductor-score" }
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
