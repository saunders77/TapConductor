[workspace]
resolver = "2"
members = [
  "crates/tapconductor-score",
  "crates/tapconductor-performance",
  "crates/tapconductor-audio",
  "crates/tauri-plugin-apple-audio-session",
  "crates/tapconductor-midi",
  "crates/tapconductor-web",
  "tools/latency-probe",
  "src-tauri",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
license-file = "LICENSING.md"
authors = ["Michael Saunders"]
repository = "https://github.com/saunders77/TapConductor"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
